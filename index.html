<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#a31f17">
<title>মহামায়া AI | দুর্গাপূজা সহায়ক</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{
  --sindoor:#a31f17; --sindoor-d:#7c1510; --haldi:#e9a71b; --haldi-s:#fdf0cf;
  --ink:#2a1a17; --muted:#7a6761; --line:#eadfd8; --paper:#fffefc; --wash:#f8f3ef; --bot:#ffffff; --chip:#fbeeea;
  --serif:"Tiro Bangla","Hind Siliguri",serif; --sans:"Hind Siliguri","Noto Sans Bengali","Vrinda",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --sindoor:#c9382e; --sindoor-d:#a82920; --haldi:#f0b73a; --haldi-s:#3a2c10; --ink:#f6ebe4; --muted:#bfa89d; --line:#41302a; --paper:#1f1513; --wash:#170f0d; --bot:#2a1d19; --chip:#34211d; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--sindoor-d);display:flex;justify-content:center;
  background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.6px);background-size:22px 22px}
.app{width:100%;max-width:760px;height:100dvh;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
@media (min-width:800px){ .app{height:min(100dvh - 32px,900px);margin:16px 0;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.35)} }

/* header */
header{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:max(12px,env(safe-area-inset-top)) 16px 10px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:400 24px/1.15 var(--serif);color:var(--sindoor)}
.brand h1 span{font:700 11px var(--sans);letter-spacing:.08em;background:var(--haldi);color:#2a1a17;border-radius:5px;padding:1px 6px;vertical-align:middle;margin-left:4px}
.brand p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.hctl{display:flex;align-items:center;gap:8px}
#lang{font:inherit;font-size:14px;color:var(--ink);background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--wash);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.icon-btn:hover{border-color:var(--sindoor);color:var(--sindoor)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:8px;max-width:100%;background:var(--haldi-s);color:var(--ink);border:1px solid var(--haldi);border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:600}
.pill::before{content:"🪔"}
.pill:empty{display:none}
/* lal-par sari border */
.border{height:9px;flex:0 0 auto;background:repeating-linear-gradient(90deg,transparent 0 0),linear-gradient(var(--sindoor) 0 3px,var(--paper) 3px 5px,var(--sindoor) 5px 6px,var(--paper) 6px 7px,var(--haldi) 7px 9px)}

/* quick actions + topics */
#quick{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
#topics{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none;border-bottom:1px solid var(--line)}
#quick::-webkit-scrollbar,#topics::-webkit-scrollbar{display:none}
#quick button{flex:0 0 auto;font:inherit;font-size:14.5px;font-weight:600;color:#fff;background:var(--sindoor);border:0;border-radius:999px;padding:7px 15px;cursor:pointer;white-space:nowrap}
#quick button:hover{background:var(--sindoor-d)}
#topics button{flex:0 0 auto;font:inherit;font-size:13.5px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;white-space:nowrap}
#topics button:hover{color:var(--sindoor);border-color:var(--sindoor)}

/* chat log */
#log{position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px;background:var(--wash);-webkit-overflow-scrolling:touch}
.msg{display:flex;max-width:100%}
.msg.user{justify-content:flex-end}
.bubble{max-width:min(92%,600px);padding:10px 14px;border-radius:16px;line-height:1.65;font-size:16px;overflow-wrap:anywhere}
.msg.bot .bubble{background:var(--bot);border:1px solid var(--line);border-left:3px solid var(--haldi);border-top-left-radius:5px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.msg.user .bubble{background:var(--sindoor);color:#fff;border-top-right-radius:5px}
.bubble p{margin:0;white-space:pre-line}
.bubble .note{display:block;margin-top:6px;color:var(--muted);font-size:12.5px}
.tag{display:inline-block;margin-top:8px;font-size:12px;color:var(--muted);background:var(--wash);border-radius:6px;padding:0 8px}
a.lnk{display:inline-block;margin:2px 6px 2px 0;color:var(--sindoor);border:1px solid var(--sindoor);border-radius:999px;padding:3px 12px;font-size:14px;text-decoration:none;font-weight:600}
a.lnk:hover{background:var(--sindoor);color:#fff}
.typing{padding:12px 16px!important}
.dots{display:inline-flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{font:inherit;font-size:14px;line-height:1.35;color:var(--sindoor);background:var(--chip);border:1px solid transparent;border-radius:14px;padding:6px 12px;cursor:pointer;text-align:left}
.chips button:hover{border-color:var(--sindoor)}
.chips button.more{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
@media (prefers-color-scheme: dark){.chips button{color:#ffb4a8}}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tool{font:inherit;font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:2px 12px;cursor:pointer}
.tool:hover{color:var(--sindoor);border-color:var(--sindoor)}

/* mantra */
.mantra h3{margin:0 0 6px;font:400 18px/1.35 var(--serif);color:var(--sindoor)}
.mantra .day{display:inline-block;background:var(--haldi);color:#2a1a17;font-size:12px;font-weight:700;border-radius:6px;padding:0 8px;margin-bottom:8px}
.mantra pre{margin:0;white-space:pre-wrap;font:inherit;font-size:16.5px;line-height:1.7;background:var(--haldi-s);border-left:3px solid var(--haldi);padding:10px 12px;border-radius:8px}
.mean{margin-top:10px;padding:6px 12px;border-left:3px solid var(--muted);color:var(--ink);font-size:15px}
.mean p{margin:4px 0}

/* schedule */
.sched h3,.wlist h3,.pandal h3{margin:0 0 8px;font:400 18px/1.3 var(--serif);color:var(--sindoor)}
.srow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:var(--wash);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.srow:hover{border-color:var(--sindoor)}
.srow.today{border-color:var(--haldi);background:var(--haldi-s)}
.sdate{flex:0 0 88px;font-weight:700;font-size:14px;color:var(--sindoor);line-height:1.3}
.smid{flex:1;display:flex;flex-direction:column;font-size:14px;line-height:1.45;min-width:0}
.smid b{font-size:15.5px}
.smid span{color:var(--muted)}
.srow em{font-style:normal;font-size:11.5px;font-weight:700;background:var(--haldi);color:#2a1a17;border-radius:6px;padding:0 7px}
.shint{margin:8px 0 0!important;font-size:12.5px;color:var(--muted)}

/* weapons */
.wrow{display:grid;grid-template-columns:30px 1fr;column-gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line)}
.wrow:last-of-type{border-bottom:0}
.wem{grid-row:span 2;font-size:22px}
.wnm{font-weight:600}
.wgv{color:var(--muted);font-size:14px}

/* weather */
.wx{min-width:min(78vw,520px)}
.wxmsg{margin:6px 0!important;color:var(--muted);font-size:14.5px}
.wxmsg.small{font-size:13px}
.wxhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.wxhead b{font:400 19px/1.3 var(--serif);color:var(--sindoor)}
.link{background:none;border:0;color:var(--sindoor);font:inherit;font-size:13.5px;text-decoration:underline;cursor:pointer;padding:0}
.wxnow{display:flex;align-items:center;gap:12px}
.wxicon{font-size:52px;line-height:1}
.wxtemp{display:flex;flex-direction:column}
.wxtemp strong{font-size:38px;line-height:1;font-weight:700}
.wxtemp span{color:var(--muted);font-size:15px}
.wxfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:12px 0 4px}
.wxfacts div{background:var(--wash);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column}
.wxfacts small{color:var(--muted);font-size:12px}
.wxfacts b{font-size:15px}
.wx h4{margin:14px 0 6px;font-size:14px;color:var(--sindoor);letter-spacing:.01em}
.wxdays{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wxday{background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:6px 6px 7px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.wxday.today{border-color:var(--haldi);background:var(--haldi-s)}
.wxday small{font-size:12px;color:var(--muted)}
.wxday em{font-style:normal;font-size:12px;line-height:1.25;min-height:30px;display:flex;align-items:center}
.wxdi{font-size:24px;line-height:1.2}
.wxday b{font-size:13px;white-space:nowrap}
.wxrain{font-size:12px;color:var(--muted)}
.wxrain.wet{color:#1a63c4;font-weight:700}
@media (prefers-color-scheme: dark){.wxrain.wet{color:#7db4ff}}
.wxday .na{color:var(--muted);padding:12px 0}
.wxtip{margin:8px 0 0!important;padding:8px 12px;border-radius:10px;background:var(--wash);font-size:14px}
.wxtip.wet{background:#e8f1ff;color:#123a73}
@media (prefers-color-scheme: dark){.wxtip.wet{background:#17283f;color:#b9d6ff}}
.wxhours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.wxhours>div{flex:0 0 58px;background:var(--wash);border-radius:10px;padding:6px 4px;text-align:center;display:flex;flex-direction:column;align-items:center}
.wxhours small{font-size:11.5px;color:var(--muted)}
.wxhours span{font-size:20px}
.wxsrc{margin:10px 0 0!important;font-size:12px;color:var(--muted)}
.wxpick{margin-top:10px}
.wxform{display:flex;flex-wrap:wrap;gap:6px}
.wxform input{flex:1 1 150px;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--wash);border:1px solid var(--line);border-radius:999px;padding:7px 14px;outline:none}
.wxform input:focus{border-color:var(--sindoor)}
.wxform .primary{font:inherit;font-weight:600;color:#fff;background:var(--sindoor);border:0;border-radius:999px;padding:7px 16px;cursor:pointer}
.wxform .ghost{font:inherit;font-size:14px;color:var(--sindoor);background:transparent;border:1px solid var(--sindoor);border-radius:999px;padding:6px 12px;cursor:pointer}
.wxlist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.wxlist button{font:inherit;text-align:left;color:var(--ink);background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.wxlist button:hover{border-color:var(--sindoor)}
.wx[hidden],.wxpick[hidden]{display:none}

/* composer */
#form{display:flex;align-items:center;gap:8px;padding:10px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.field{flex:1;min-width:0;display:flex;align-items:center;background:var(--wash);border:1px solid var(--line);border-radius:999px;padding-right:4px}
.field:focus-within{border-color:var(--sindoor);box-shadow:0 0 0 3px rgba(163,31,23,.15)}
#input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:11px 6px 11px 16px;outline:none}
#mic{width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:50%;display:grid;place-items:center;cursor:pointer}
#mic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#mic.on{background:var(--sindoor);color:#fff;animation:b 1s infinite}
#mic[hidden]{display:none}
#send{flex:0 0 46px;height:46px;border:0;border-radius:50%;background:var(--sindoor);color:#fff;display:grid;place-items:center;cursor:pointer}
#send svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#send:hover:not(:disabled){background:var(--sindoor-d)}
#send:disabled,#input:disabled{opacity:.5;cursor:not-allowed}
#foot{text-align:center;font-size:11.5px;color:var(--muted);padding:0 14px max(8px,env(safe-area-inset-bottom));margin-top:-2px;background:var(--paper)}
:focus-visible{outline:3px solid var(--haldi);outline-offset:2px}
@media (max-width:480px){
  .brand h1{font-size:22px} .brand p{font-size:12.5px}
  .bubble{max-width:96%;font-size:15.5px;padding:9px 12px}
  .wxdays{grid-template-columns:repeat(3,1fr)}
  .sdate{flex-basis:80px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
<link rel="stylesheet" href="gallery.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>মহামায়া<span>AI</span></h1><p>দুর্গাপূজা সহায়ক ২০২৬</p><span id="countdown" class="pill" aria-live="polite"></span></div>
    <div class="hctl">
      <select id="lang" aria-label="ভাষা">
        <option value="bn">বাংলা</option><option value="en">English</option><option value="hi">हिन्दी</option><option value="bl">Banglish</option>
      </select>
      <button id="clear" class="icon-btn" type="button" aria-label="নতুন চ্যাট" title="নতুন চ্যাট">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>
  <div class="border" aria-hidden="true"></div>

  <nav id="quick" aria-label="দ্রুত কাজ"></nav>
  <nav id="topics" aria-label="বিষয়"></nav>

  <main id="log" role="log" aria-live="polite"></main>

  <form id="form" autocomplete="off">
    <div class="field">
      <input id="input" type="text" placeholder="আপনার প্রশ্ন লিখুন…" aria-label="প্রশ্ন" enterkeyhint="send" autocapitalize="off" spellcheck="false" disabled>
      <button id="mic" type="button" aria-label="ভয়েসে বলুন" title="ভয়েসে বলুন">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
    <button id="send" type="submit" aria-label="পাঠান" disabled>
      <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <div id="foot"></div>
</div>
<noscript>এই পেজ চালাতে JavaScript চালু করুন।</noscript>
<script src="dataset.js" defer></script>
<script src="script.js" defer></script>
<script src="extras.js" defer></script>
<script src="gallery.js" defer></script>
<script src="crowd-config.js" defer></script>
<script src="crowd.js" defer></script>
<script src="crowd-hook.js" defer></script>
</body>
</html>
